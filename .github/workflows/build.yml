name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libebur128-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev
      - name: Configure with independent libebur128 tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGAINPILOT_REFERENCE_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage install tree
        run: |
          cmake --install build --prefix "$PWD/stage"
      - name: Generate packages
        run: cpack --config build/CPackConfig.cmake
      - uses: actions/upload-artifact@v6
        with:
          name: gainpilot-linux-packages
          path: build/packages/*
      - uses: actions/upload-artifact@v6
        with:
          name: gainpilot-linux-stage
          path: stage/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Download pinned plugin validator
        run: |
          curl -L --fail https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip -o "$RUNNER_TEMP/pluginval.zip"
          unzip -q "$RUNNER_TEMP/pluginval.zip" -d "$RUNNER_TEMP/pluginval"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGAINPILOT_ENABLE_LV2=OFF -DGAINPILOT_PLUGINVAL="$RUNNER_TEMP/pluginval/pluginval.app/Contents/MacOS/pluginval"
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage install tree
        run: |
          cmake --install build --prefix "$PWD/stage"
      - name: Generate packages
        run: cpack --config build/CPackConfig.cmake
      - uses: actions/upload-artifact@v6
        with:
          name: gainpilot-macos-packages
          path: build/packages/*
      - uses: actions/upload-artifact@v6
        with:
          name: gainpilot-macos-stage
          path: stage/*

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install packaging toolchains
        shell: pwsh
        run: |
          choco install nsis wixtoolset --no-progress -y
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path $nsisPath) {
            $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $wixDir = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory | Where-Object { $_.Name -like 'WiX Toolset*' } | Select-Object -First 1
          if ($null -ne $wixDir) {
            Join-Path $wixDir.FullName "bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGAINPILOT_ENABLE_LV2=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage install tree
        shell: pwsh
        run: |
          cmake --install build --prefix "$PWD/stage"
      - name: Generate packages
        shell: pwsh
        run: cpack --config build/CPackConfig.cmake
      - uses: actions/upload-artifact@v6
        with:
          name: gainpilot-windows-packages
          path: build/packages/*
      - uses: actions/upload-artifact@v6
        with:
          name: gainpilot-windows-stage
          path: stage/*
