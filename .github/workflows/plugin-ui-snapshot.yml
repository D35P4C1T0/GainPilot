name: plugin-ui-snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-ui-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev xvfb

      - name: Configure snapshot renderer
        run: |
          cmake -S . -B build-ui-snapshot \
            -DCMAKE_BUILD_TYPE=Release \
            -DGAINPILOT_ENABLE_TESTS=OFF \
            -DGAINPILOT_ENABLE_LV2=OFF \
            -DGAINPILOT_ENABLE_WX_UI=OFF \
            -DGAINPILOT_ENABLE_GTK_UI=ON \
            -DGAINPILOT_ENABLE_UI_SNAPSHOT=ON

      - name: Build snapshot renderer
        run: cmake --build build-ui-snapshot --config Release --target gainpilot_ui_snapshot

      - name: Render plugin UI
        run: xvfb-run -a ./build-ui-snapshot/gainpilot_ui_snapshot docs/assets/gainpilot-ui.png

      - name: Ensure README references snapshot
        run: cmake -DREADME_PATH="$PWD/README.md" -DIMAGE_PATH="docs/assets/gainpilot-ui.png" -P cmake/UpdateReadmeScreenshot.cmake

      - name: Commit snapshot and README
        run: |
          if ! git status --porcelain -- README.md docs/assets/gainpilot-ui.png | grep -q .; then
            echo "No plugin UI snapshot changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/assets/gainpilot-ui.png
          git commit -m "docs: update plugin UI snapshot"
          git push
